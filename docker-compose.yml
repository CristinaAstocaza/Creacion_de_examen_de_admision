services:
  postgres:
    image: postgres:17-alpine
    container_name: examen_postgres
    restart: always
    environment:
      POSTGRES_DB: bd_examen_admi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./bd_limpia_con_preguntas.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bd_examen_admi"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: examen_backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bd_examen_admi
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-divad3mq2}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-477812598369763}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-3lxFKvOX8ojOcfNY-hlNHDdZwZs}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-AQ.Ab8RN6LGJ_MhCBTsUE7_7HMBeW_0zR842eyvGmfHWNPUIenfWw}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: examen_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
