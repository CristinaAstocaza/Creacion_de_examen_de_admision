
spring.application.name=admision

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/bd_examen_admi
spring.datasource.username=postgres
spring.datasource.password=12345

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Puerto
server.port=8080

# Cloudinary — configurar via variable de entorno o application-local.properties
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:tu_cloud_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:tu_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:tu_api_secret}

# Gemini — configurar via variable de entorno o application-local.properties
gemini.api.key=${GEMINI_API_KEY:tu_gemini_api_key}