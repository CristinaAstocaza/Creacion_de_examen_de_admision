spring.application.name=admision

# Demo universitaria: base de datos temporal en memoria
spring.datasource.url=jdbc:h2:mem:examdemo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA + datos iniciales
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Puerto: plataformas cloud suelen inyectar PORT
server.port=${PORT:8080}

# Archivos para importación
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=100MB

# Orígenes permitidos, separados por coma
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Python para los scripts de IA
python.command=${PYTHON_COMMAND:python3}

# Credenciales: configurar SOLO como variables de entorno
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
gemini.api.key=${GEMINI_API_KEY:}
